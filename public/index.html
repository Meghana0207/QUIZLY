<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUIZLY | Online Quiz Management</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="dashboard.css"></head><body>
<header><a class="brand" href="#">QUIZ<span>LY</span></a><nav id="nav"></nav></header><main id="app"></main><template id="auth-template"><section class="hero"><p class="eyebrow">ONLINE QUIZ MANAGEMENT SYSTEM</p><h1>Learn, attempt, and measure your progress.</h1><p>A simple platform for secure quiz administration and instant results.</p></section><section class="auth-grid"><form id="login-form" class="card" autocomplete="on"><h2>Welcome back</h2><label>Email<input type="email" name="email" autocomplete="username" required></label><label class="password-label" for="login-password">Password</label><span class="password-field"><input id="login-password" type="password" name="password" autocomplete="current-password" required><button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false"><svg data-password-show-icon viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg data-password-hide-icon viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path><path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a14 14 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 3.1-.5"></path></svg></button></span><button>Log in</button></form><form id="register-form" class="card"><h2>Create account</h2><label>Full name<input name="fullName" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label><button>Create account</button></form></section></template>
<script src="app.js"></script></body></html>
